spring.datasource.url=jdbc:postgresql://localhost:5432/dispatchdesk
spring.datasource.username=dispatchdesk
spring.datasource.password=dispatchdesk
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.port=8080

jwt.secret=dispatchdesk-secret-key-change-in-production-at-least-256-bits-long
jwt.expiration=86400000

cors.allowed-origins=http://localhost:5173