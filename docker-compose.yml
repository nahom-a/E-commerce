version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dispatchdesk-db
    environment:
      POSTGRES_DB: dispatchdesk
      POSTGRES_USER: dispatchdesk
      POSTGRES_PASSWORD: dispatchdesk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: